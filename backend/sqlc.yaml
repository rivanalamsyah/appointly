version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "gen/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_exported_queries: false
        emit_result_struct_pointers: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type: "*string"
          - db_type: "text"
            nullable: true
            go_type: "*string"
          - db_type: "bigint"
            nullable: true
            go_type: "*int64"
          - db_type: "int4"
            nullable: true
            go_type: "*int32"
          - db_type: "bool"
            nullable: true
            go_type: "*bool"
          - db_type: "timestamptz"
            nullable: true
            go_type: "*time.Time"
